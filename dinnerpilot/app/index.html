<style>
  :root { --teal-top:#11575A; --teal-bottom:#0A3D40; --orange:#D9652F; --orange-deep:#B85E2A;
          --cream:#FFF8F1; --ink:#1A1917; --ink-mid:#4A4845; --ink-soft:#8A8885; --line:#E8E1D8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 22px; padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
         background: linear-gradient(180deg, var(--teal-top), var(--teal-bottom)); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .brand span { font: 700 30px/1 ui-serif, "New York", Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  .brand b { color: #F4A06F; font-weight: 700; }
  .card { width: 100%; max-width: 440px; background: var(--cream); border-radius: 22px; padding: 32px 26px 28px;
          box-shadow: 0 18px 50px rgba(0,0,0,.28); text-align: center; }
  .badge { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
           background: #E8F0EB; color: #2F6B4F; }
  .badge.warn { background: #FDF0E6; color: var(--orange-deep); }
  h1 { margin: 0 0 8px; font: 700 26px/1.2 ui-serif, "New York", Georgia, "Times New Roman", serif; }
  p { margin: 0 0 14px; color: var(--ink-mid); }
  .btn { display: block; width: 100%; padding: 15px 18px; margin-top: 10px; border: 0; border-radius: 14px;
         background: var(--orange); color: #fff; font: 600 17px/1.2 inherit; text-decoration: none; cursor: pointer; }
  .btn:hover { background: var(--orange-deep); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn--ghost { background: transparent; color: var(--orange-deep); border: 1.5px solid var(--line); }
  .btn--ghost:hover { background: #fff; }
  .hint { font-size: 14px; color: var(--ink-soft); margin-top: 14px; }
  form { text-align: left; margin-top: 8px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-mid); margin: 12px 0 6px; }
  input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; font: 16px inherit;
          background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--orange); }
  .msg { min-height: 1.4em; margin-top: 10px; font-size: 14px; color: #B3261E; text-align: center; }
  footer { color: rgba(255,255,255,.7); font-size: 13px; text-align: center; }
  footer a { color: rgba(255,255,255,.85); }
  [hidden] { display: none !important; }
</style>
<script>
  // Send visitors straight to the App Store; the page below is only seen if this doesn't run.
  var APP = "https://apps.apple.com/us/app/dinnerpilot/id6792765639";
  var q = location.search ? location.search.slice(1) : "";
  location.replace(APP + (q ? "?" + q : ""));
</script>
</head>
<body>
  <a class="brand" href="/dinnerpilot/" aria-label="DinnerPilot">
    <img src="../../assets/dp-icon.png" alt="">
    <span>Dinner<b>Pilot</b></span>
  </a>
  <main class="card">
    <h1>Your family's meals, planned in a minute</h1>
    <p>DinnerPilot plans your week of meals to fit your grocery budget and builds the grocery list in one tap.</p>
    <a class="btn" href="https://apps.apple.com/us/app/dinnerpilot/id6792765639">Get it free on the App Store</a>
    <p class="hint">For iPhone.</p>
  </main>
  <footer><a href="/dinnerpilot/">About DinnerPilot</a> · <a href="/dinnerpilot/privacy/">Privacy</a></footer>
</body>
</html>
